# GitHub 무료 빌드 서버에서 테스트용 APK와 Play 스토어 업로드용 AAB를 만듭니다.
# 코드를 push 하거나, Actions 탭에서 "Run workflow" 를 누르면 실행됩니다.
#
# 산출물
#  - Releases: FitAlarm.apk (테스트용 QA 빌드: 출시와 같이 난독화, 테스트 키 서명 → 폰에 바로 설치)
#  - 이 실행의 Artifacts: FitAlarm-playstore-aab (출시용, 업로드 키 서명 → Play Console 에 업로드)
#    업로드 키는 저장소 Secrets(UPLOAD_KEYSTORE_BASE64 등)에 등록되어 있을 때만 만들어집니다.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download Google holiday feed (for parser check)
        continue-on-error: true
        run: |
          curl -sSL --max-time 30 -o holidays.ics \
            "https://calendar.google.com/calendar/ical/ko.south_korea%23holiday%40group.v.calendar.google.com/public/basic.ics" || true
          ls -la holidays.ics || true

      - name: Prepare upload key (if configured)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "FITALARM_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "HAS_UPLOAD_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_UPLOAD_KEY=false" >> "$GITHUB_ENV"
            echo "::warning title=Upload key not configured::저장소 Secrets 에 UPLOAD_KEYSTORE_BASE64 가 없어 Play 스토어용 AAB 는 테스트 키로 시험 빌드만 합니다 (업로드 불가)."
          fi

      - name: Unit tests + build
        env:
          HOLIDAY_ICS_FILE: ${{ github.workspace }}/holidays.ics
          FITALARM_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          FITALARM_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          FITALARM_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if [ "$HAS_UPLOAD_KEY" != "true" ]; then
            # 업로드 키가 아직 없으면 테스트 키로 출시(release) 빌드 과정만 점검. 이 AAB 는 올리지 않음
            export FITALARM_UPLOAD_KEYSTORE="$GITHUB_WORKSPACE/app/fitalarm-debug.keystore"
            export FITALARM_UPLOAD_STORE_PASSWORD=android
            export FITALARM_UPLOAD_KEY_ALIAS=androiddebugkey
            export FITALARM_UPLOAD_KEY_PASSWORD=android
          fi
          ./gradlew --no-daemon --stacktrace test assembleDebug assembleQa bundleRelease 2>&1 | tee build.log

      - name: Verify AAB signature
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tail -1
          FP=$(keytool -printcert -jarfile "$AAB" | grep -m1 "SHA256:" | sed 's/^[[:space:]]*//')
          SIZE=$(du -h "$AAB" | cut -f1)
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then TITLE="Play AAB"; else TITLE="Play AAB (dry run - test key, do not upload)"; fi
          echo "::notice title=${TITLE}::signed OK · version ${VER} · ${SIZE} · cert ${FP}"
          cp "$AAB" "FitAlarm-${VER}-playstore.aab"

      - name: Verify ad units (Play AAB = real ads, test APK = Google test ads only)
        run: |
          rm -rf adcheck && mkdir -p adcheck/aab adcheck/qa
          unzip -q -o app/build/outputs/bundle/release/app-release.aab 'base/dex/*' -d adcheck/aab
          unzip -q -o app/build/outputs/apk/qa/app-qa.apk 'classes*.dex' -d adcheck/qa
          REL=$(cat adcheck/aab/base/dex/*.dex | grep -aoE 'ca-app-pub-[0-9]+/[0-9]+' | sort -u | tr '\n' ' ')
          QA=$(cat adcheck/qa/*.dex | grep -aoE 'ca-app-pub-[0-9]+/[0-9]+' | sort -u | tr '\n' ' ')
          echo "::notice title=Ad units::Play AAB: ${REL} / test APK: ${QA}"
          if echo "$QA" | grep -q 'pub-9101880128165365/'; then
            echo "::error title=Real ad unit in test APK::테스트용 APK 에 실제 광고 단위가 들어 있습니다 (ADS_TEST_MODE 확인)"; exit 1
          fi
          for id in 8573116741 1923947916 5755381718; do
            echo "$REL" | grep -q "pub-9101880128165365/$id" || { echo "::error title=Ad unit missing in AAB::출시 AAB 에 광고 단위 $id 가 없습니다"; exit 1; }
          done
          if echo "$REL" | grep -q '3940256099942544/'; then
            echo "::error title=Test ad unit in AAB::출시 AAB 에 테스트 광고 단위가 들어 있습니다"; exit 1
          fi

      - name: Report holiday feed check
        if: always()
        run: |
          if [ -f app/build/holiday-feed-summary.txt ]; then
            msg=$(sed 's/%/%25/g' app/build/holiday-feed-summary.txt | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Holiday feed::${msg}"
          fi

      - name: Report build errors
        if: failure()
        run: |
          # 오류 줄만 뽑아 하나의 annotation 으로 남김 (API 로 읽을 수 있게)
          msg=$(grep -E "^e: |error:|What went wrong|FAILED|Exception|AAPT|Lint found|> " build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle build failed::${msg}"

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/qa/app-qa.apk FitAlarm.apk
          cp app/build/outputs/apk/debug/app-debug.apk FitAlarm-debug.apk
          QA=$(du -h FitAlarm.apk | cut -f1); DBG=$(du -h FitAlarm-debug.apk | cut -f1)
          echo "::notice title=APK sizes::QA(release-like, R8) ${QA} · debug ${DBG}"

      - uses: actions/upload-artifact@v4
        with:
          name: FitAlarm-apk
          path: |
            FitAlarm.apk
            FitAlarm-debug.apk

      - name: Upload Play Store AAB (artifact only, not public release)
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FitAlarm-playstore-aab
          path: |
            FitAlarm-*-playstore.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Publish test APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 알람핏 빌드 ${{ github.run_number }}
          body: 테스트용 APK 입니다 (출시 버전과 같은 난독화 설정, 테스트 키 서명). 폰에서 FitAlarm.apk 를 내려받아 설치하세요. Play 스토어 업로드용 AAB 는 이 빌드의 Actions 실행 페이지 Artifacts 에 있습니다.
          files: FitAlarm.apk
