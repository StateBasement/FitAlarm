# GitHub 무료 빌드 서버에서 APK를 만들어 Releases 에 올립니다.
# 코드를 push 하거나, Actions 탭에서 "Run workflow" 를 누르면 실행됩니다.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download Google holiday feed (for parser check)
        continue-on-error: true
        run: |
          curl -sSL --max-time 30 -o holidays.ics \
            "https://calendar.google.com/calendar/ical/ko.south_korea%23holiday%40group.v.calendar.google.com/public/basic.ics" || true
          ls -la holidays.ics || true

      - name: Unit tests + build debug APK
        env:
          HOLIDAY_ICS_FILE: ${{ github.workspace }}/holidays.ics
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace test assembleDebug 2>&1 | tee build.log

      - name: Report holiday feed check
        if: always()
        run: |
          if [ -f app/build/holiday-feed-summary.txt ]; then
            msg=$(sed 's/%/%25/g' app/build/holiday-feed-summary.txt | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Holiday feed::${msg}"
          fi

      - name: Report build errors
        if: failure()
        run: |
          # 오류 줄만 뽑아 하나의 annotation 으로 남김 (API 로 읽을 수 있게)
          msg=$(grep -E "^e: |error:|What went wrong|FAILED|Exception|AAPT|> " build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle build failed::${msg}"

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FitAlarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FitAlarm-apk
          path: FitAlarm.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 운동 알람 빌드 ${{ github.run_number }}
          body: 폰에서 FitAlarm.apk 를 내려받아 설치하세요.
          files: FitAlarm.apk
